name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions: {}

env:
  DENO_DIR: ~/.deno

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6.2.0
        with:
          fetch-depth: 1
      - name: Cache Deno dependencies
        uses: actions/cache@d4323d4d3a2e36bf352f8f2ef86b4a3e5ef63e5d # v4.2.2
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@909c0c441fb18c26536c4a0e2ca7836e96e42e4c # v2.2.0
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: cd docs && deno install
      - name: Build with VitePress
        run: deno task docs:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac2b3c603fc # v4.0.5
