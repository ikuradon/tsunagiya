name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  DENO_DIR: ~/.deno

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ====================
  # CI jobs (always run)
  # ====================
  guard-runtime-access:
    name: Runtime access guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Check direct runtime access
        run: deno run --allow-read=src scripts/guard_runtime_access.ts

  test-deno:
    name: Test on Deno
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        deno-version: [v2.x]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: ${{ matrix.deno-version }}
      - run: deno task check
      - run: deno task test
      - name: Generate coverage
        run: deno task coverage
      - name: Coverage report (LCOV)
        run: deno coverage ./.cov --lcov --output=.cov/lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          files: .cov/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: .cov/

  publish-check:
    name: Publish dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - run: deno publish --dry-run --allow-dirty

  npm-build-check:
    name: npm build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Build npm package
        run: deno run -A scripts/build_npm.ts
      - name: Verify package structure
        run: |
          test -f npm/package.json
          test -d npm/esm
          test -d npm/types

  e2e-libraries:
    name: E2E Library Test (${{ matrix.library }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        library: [nostr-tools, ndk, rx-nostr, nostr-fetch]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Run E2E tests
        run: deno task example:${{ matrix.library }}

  e2e-node:
    name: E2E Library Test - Node.js (${{ matrix.library }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        library: [nostr-tools, ndk, rx-nostr, nostr-fetch]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
      - name: Install dependencies
        working-directory: examples
        run: npm install
      - name: Run E2E tests
        working-directory: examples
        run: |
          npx tsx ${{ matrix.library }}/client_test.ts
          if [ -f "${{ matrix.library }}/signing_test.ts" ]; then
            npx tsx ${{ matrix.library }}/signing_test.ts
          fi

  e2e-bun:
    name: E2E Library Test - Bun (${{ matrix.library }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        library: [nostr-tools, ndk, rx-nostr, nostr-fetch]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        working-directory: examples
        run: bun install
      - name: Run E2E tests
        working-directory: examples
        run: |
          bun test ${{ matrix.library }}/client_test.ts
          if [ -f "${{ matrix.library }}/signing_test.ts" ]; then
            bun test ${{ matrix.library }}/signing_test.ts
          fi

  docs-check:
    name: Docs build / lint / format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Check docs format
        run: deno fmt --check docs/.vitepress/
      - name: Lint docs
        run: deno lint docs/.vitepress/
      - name: Build docs
        run: deno task docs:build

  # =======================================
  # Publish (v* tags only, after all CI)
  # =======================================

  publish-jsr:
    name: Publish to JSR
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        guard-runtime-access,
        test-deno,
        publish-check,
        npm-build-check,
        e2e-libraries,
        e2e-node,
        e2e-bun,
        docs-check,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Check not a dev version
        run: |
          VERSION=$(deno eval "import denoJson from './deno.json' with { type: 'json' }; console.log(denoJson.version)")
          if echo "$VERSION" | grep -q "\-dev"; then
            echo "Error: version '$VERSION' contains '-dev'. Aborting publish."
            exit 1
          fi
          echo "Version: $VERSION (OK)"
      - name: Publish package
        run: deno publish --allow-dirty

  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        guard-runtime-access,
        test-deno,
        publish-check,
        npm-build-check,
        e2e-libraries,
        e2e-node,
        e2e-bun,
        docs-check,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Build npm package
        run: deno run -A scripts/build_npm.ts
      - name: Publish to npm
        working-directory: npm
        run: NODE_AUTH_TOKEN="" npm publish --provenance --access public

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-jsr, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes

  # =============================================
  # Deploy docs (main only, after CI passes)
  # =============================================

  deploy-docs-build:
    name: Build documentation
    if: github.ref == 'refs/heads/main'
    needs: [guard-runtime-access, test-deno, docs-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Cache Deno dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: cd docs && deno install
      - name: Build with VitePress
        run: deno task docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy-docs:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: [deploy-docs-build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
