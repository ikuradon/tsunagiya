name: CI
on:
  push:
  pull_request:

jobs:
  test-deno:
    name: Test on Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test

  test-node:
    name: Test on Node.js
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm install -g tsx
          npx jsr add @ikuradon/tsunagiya -D
      - name: Test basic import
        run: |
          cat > test-node.mjs << 'EOF'
          import { MockPool } from '@ikuradon/tsunagiya';
          const pool = new MockPool();
          console.log('✓ MockPool imported successfully');
          pool.install();
          console.log('✓ pool.install() works');
          pool.uninstall();
          console.log('✓ pool.uninstall() works');
          EOF
          node test-node.mjs

  test-bun:
    name: Test on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bunx jsr add @ikuradon/tsunagiya -D
      - name: Test basic import
        run: |
          cat > test-bun.mjs << 'EOF'
          import { MockPool } from '@ikuradon/tsunagiya';
          const pool = new MockPool();
          console.log('✓ MockPool imported successfully');
          pool.install();
          console.log('✓ pool.install() works');
          pool.uninstall();
          console.log('✓ pool.uninstall() works');
          EOF
          bun test-bun.mjs

  e2e:
    name: E2E Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: deno
            command: deno test -A tests/e2e/e2e_client_test.ts
          - runtime: node
            command: npx tsx tests/e2e/e2e_client_test.ts
          - runtime: bun
            command: bun run tests/e2e/e2e_client_test.ts
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: 22.x
      - name: Install tsx
        if: matrix.runtime == 'node'
        run: npm install -g tsx
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - name: Run E2E tests
        run: ${{ matrix.command }}

  e2e-libraries:
    name: E2E Library Test (${{ matrix.library }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [nostr-tools, ndk, rx-nostr]
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run E2E tests
        run: deno task test:e2e:${{ matrix.library }}
