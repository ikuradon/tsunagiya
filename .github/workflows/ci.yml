name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-deno:
    name: Test on Deno
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deno-version: [v1.x, v2.x]
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - run: deno task check
      - run: deno task test
      - name: Generate coverage
        run: deno task coverage
      - name: Coverage report
        run: deno task coverage:report

  test-node:
    name: Test on Node.js
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm install -g tsx
          npx jsr add @ikuradon/tsunagiya -D
      - name: Test basic import
        run: |
          cat > test-node.mjs << 'EOF'
          import { MockPool } from '@ikuradon/tsunagiya';
          const pool = new MockPool();
          console.log('✓ MockPool imported successfully');
          pool.install();
          console.log('✓ pool.install() works');
          pool.uninstall();
          console.log('✓ pool.uninstall() works');
          EOF
          node test-node.mjs

  test-bun:
    name: Test on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bunx jsr add @ikuradon/tsunagiya -D
      - name: Test basic import
        run: |
          cat > test-bun.mjs << 'EOF'
          import { MockPool } from '@ikuradon/tsunagiya';
          const pool = new MockPool();
          console.log('✓ MockPool imported successfully');
          pool.install();
          console.log('✓ pool.install() works');
          pool.uninstall();
          console.log('✓ pool.uninstall() works');
          EOF
          bun test-bun.mjs

  e2e-libraries:
    name: E2E Library Test (${{ matrix.library }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [nostr-tools, ndk, rx-nostr, nostr-fetch]
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.1
      - name: Run E2E tests
        run: deno task example:${{ matrix.library }}

  e2e-node:
    name: E2E Library Test - Node.js (${{ matrix.library }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [nostr-tools, ndk, rx-nostr, nostr-fetch]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        working-directory: examples
        run: npm install
      - name: Run E2E tests
        working-directory: examples
        run: npx tsx ${{ matrix.library }}/client_test.ts

  e2e-bun:
    name: E2E Library Test - Bun (${{ matrix.library }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [nostr-tools, ndk, rx-nostr, nostr-fetch]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: examples
        run: bun install
      - name: Run E2E tests
        working-directory: examples
        run: bun test ${{ matrix.library }}/client_test.ts
