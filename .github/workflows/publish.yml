name: Publish
on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  DENO_DIR: ~/.deno

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6.2.0
      - name: Cache Deno dependencies
        uses: actions/cache@d4323d4d3a2e36bf352f8f2ef86b4a3e5ef63e5d # v4.2.2
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@909c0c441fb18c26536c4a0e2ca7836e96e42e4c # v2.2.0
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test:all
      - name: Check not a dev version
        run: |
          VERSION=$(deno eval "import denoJson from './deno.json' with { type: 'json' }; console.log(denoJson.version)")
          if echo "$VERSION" | grep -q "\-dev"; then
            echo "Error: version '$VERSION' contains '-dev'. Aborting publish."
            exit 1
          fi
          echo "Version: $VERSION (OK)"
      - name: Dry run publish
        run: deno publish --dry-run
      - name: Publish package
        run: deno publish

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6.2.0
      - name: Cache Deno dependencies
        uses: actions/cache@d4323d4d3a2e36bf352f8f2ef86b4a3e5ef63e5d # v4.2.2
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - uses: denoland/setup-deno@909c0c441fb18c26536c4a0e2ca7836e96e42e4c # v2.2.0
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642195f882d025a3c667d10 # v4.4.0
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
      - name: Build npm package
        run: deno run -A scripts/build_npm.ts
      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public
